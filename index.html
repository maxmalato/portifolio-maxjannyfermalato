<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon-max.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Aplica o tema antes da primeira pintura (espelha useThemeStore.setInitialTheme) -->
    <script>
      try {
        const theme = localStorage.getItem('theme');
        if (theme === 'dark' || (!theme && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Portfólio | Maxjannyfer Malato</title>
    <meta
      name="description"
      content="Portfólio de Maxjannyfer Malato, Desenvolvedor Fullstack com C#, .NET, React e TypeScript."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Portfólio | Maxjannyfer Malato" />

      property="og:description"

    />
    <meta property="og:image" content="https://avatars.githubusercontent.com/u/128427626?v=4" />
